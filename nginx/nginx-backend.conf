# Load balancer of the BACKEND layer (internal, not published).
# Distributes the requests over the three backend replicas (round robin).
upstream siga_backend {
    zone siga_backend 64k;
    server backend1:8080;
    server backend2:8080;
    server backend3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://siga_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # shows which backend replica answered (useful to demonstrate the balancing)
        add_header X-Backend-Served-By $upstream_addr always;
    }
}