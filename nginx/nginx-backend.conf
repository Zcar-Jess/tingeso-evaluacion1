# Entry point of the system (published as port 8070): balances /api over the three backend replicas
# (round robin) and sends everything else to the frontend container.
upstream siga_backend {
    server backend1:8080;
    server backend2:8080;
    server backend3:8080;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://siga_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # shows which replica answered (useful to demonstrate the balancing)
        add_header X-Served-By $upstream_addr always;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://siga_backend;
        proxy_set_header Host $host;
        add_header X-Served-By $upstream_addr always;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
