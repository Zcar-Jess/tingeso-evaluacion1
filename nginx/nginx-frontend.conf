# Load balancer of the FRONTEND layer: the entry point of the system (published as port 8070).
# - "/" is distributed over the three frontend replicas (round robin).
# - "/api" (and the API documentation) goes on to the backend load balancer.
upstream siga_frontend {
    zone siga_frontend 64k;
    server frontend1:80;
    server frontend2:80;
    server frontend3:80;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://nginx-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://nginx-backend:80;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://siga_frontend;
        proxy_set_header Host $host;
        # shows which frontend replica answered
        add_header X-Frontend-Served-By $upstream_addr always;
    }
}
