# Configuration used by the tests. Being in src/test/resources it replaces the main
# application.properties during the test run, so no database or environment variable is needed:
# the integration tests use an in-memory H2 database.
spring.application.name=siga-ipt-test

spring.datasource.url=jdbc:h2:mem:siga_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# The security configuration needs a JWT decoder. The tests send ready-made JWTs (jwt() post-processor),
# so this address is never called.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9/unused/certs
siga.demo-data=false
