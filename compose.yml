# SIGA IPT - complete system.
#   docker compose up -d --build     (build the images here)
#   docker compose pull && docker compose up -d     (use the images from Docker Hub, e.g. on the server)
# All configuration comes from the .env file

# Shared definition of the three backend replicas
x-backend: &backend
  image: ${DOCKERHUB_USER}/siga-ipt-backend:${IMAGE_TAG:-latest}
  build: ./siga-ipt-backend
  restart: unless-stopped
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    DB_USERNAME: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    # Issuer = the public URL of Keycloak (the "iss" claim of the tokens);
    # the keys are downloaded through the internal network.
    KEYCLOAK_ISSUER_URI: http://${PUBLIC_HOST}:9090/realms/siga-ipt
    KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/siga-ipt/protocol/openid-connect/certs
    DEMO_DATA: ${DEMO_DATA:-true}
    JAVA_OPTS: -Xmx384m
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 40s

# Shared definition of the three frontend replicas
x-frontend: &frontend
  image: ${DOCKERHUB_USER}/siga-ipt-frontend:${IMAGE_TAG:-latest}
  build: ./siga-ipt-frontend
  restart: unless-stopped
  environment:
    KEYCLOAK_URL: http://${PUBLIC_HOST}:9090

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://${PUBLIC_HOST}:9090
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "9090:8080"

  # The first replica creates the tables and loads the initial data; the other two start
  # when it is ready, so they never try to do it at the same time.
  backend1:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy

  backend2:
    <<: *backend
    depends_on:
      backend1:
        condition: service_healthy

  backend3:
    <<: *backend
    depends_on:
      backend1:
        condition: service_healthy

  frontend1:
    <<: *frontend

  frontend2:
    <<: *frontend

  frontend3:
    <<: *frontend

  # Load balancer of the backend layer (internal)
  nginx-backend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy

  # Load balancer of the frontend layer: the entry point, http://localhost:8070
  nginx-frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8070:80"
    depends_on:
      - nginx-backend
      - frontend1
      - frontend2
      - frontend3

volumes:
  postgres_data:
  keycloak_data: