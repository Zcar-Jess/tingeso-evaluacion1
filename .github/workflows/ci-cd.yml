name: CI/CD SIGA IPT

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (+ 90 % coverage of services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        working-directory: siga-ipt-backend
        run: |
          chmod +x mvnw
          ./mvnw -B test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-tests
          path: siga-ipt-backend/target/site/jacoco-ut

  integration-tests:
    name: Integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run integration tests (*IT)
        working-directory: siga-ipt-backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true

  build-and-push:
    name: Build and push images to Docker Hub
    needs: [unit-tests, integration-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./siga-ipt-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-ipt-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-ipt-backend:${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./siga-ipt-frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-ipt-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/siga-ipt-frontend:${{ github.sha }}